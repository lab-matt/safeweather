<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safeweather</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; }
    header { position: sticky; top: 0; z-index: 1000; display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; gap: 1rem; padding: 1rem; background: white; border-bottom: 1px solid #aaa; }
    header h1 { margin: 0; font-size: 1.25rem; }
    .location { text-align: center; }
    details { position: relative; justify-self: end; }
    summary { cursor: pointer; }
    .settings { position: absolute; right: 0; width: 18rem; max-width: 90vw; padding: 1rem; background: white; border: 1px solid #aaa; }
    .settings p { margin: 0 0 .75rem; }
    .settings label { display: block; margin-top: .75rem; }
    .settings input { display: block; width: 100%; margin-top: .25rem; }
    .settings input[aria-invalid="true"] { border: 2px solid #b00020; }
    .error { color: #b00020; }
    main { padding: 1rem; }
    .map-wrap { position: relative; aspect-ratio: 5 / 3; overflow: hidden; border-radius: 1.5rem; background: #eee; }
    #map { height: 100%; width: 100%; }
    .map-select { position: absolute; z-index: 500; top: .75rem; right: .75rem; }
    .map-center-pin { position: absolute; z-index: 400; top: 50%; left: 50%; transform: translate(-50%, -100%); pointer-events: none; font-size: 2rem; }
    .hours { display: flex; gap: .75rem; overflow-x: scroll; padding-bottom: 1rem; }
    .days { display: flex; gap: .5rem; overflow-x: auto; padding: .5rem 0; }
    .days button { white-space: nowrap; }
    .days button[aria-pressed="true"] { font-weight: bold; border-bottom: 3px solid currentColor; }
    .hour { flex: 0 0 10rem; border: 1px solid #aaa; border-radius: 1.5rem; padding: 1rem; }
    .hour p { margin: .75rem 0; }
    @media (max-width: 480px) { header { grid-template-columns: 1fr auto; } .location { grid-column: 1 / -1; grid-row: 2; } }
  </style>
</head>
<body>
  <header>
    <h1>Safeweather</h1>
    <div class="location" id="location">Location not selected</div>
    <details>
      <summary>Settings</summary>
      <div class="settings">
        <label>Work starts <input id="work-start" type="time" value="00:00"></label>
        <label>Work ends <input id="work-end" type="time" value="00:00" aria-describedby="work-end-error"></label>
        <p id="work-end-error" class="error" role="alert" hidden>Work end time must be at or after the start time.</p>
        <p>Hazard thresholds</p>
        <label>Crane wind speed (mph) <input id="wind-limit" type="number" min="0" value="3"></label>
        <label>Rain chance (%) <input id="rain-limit" type="number" min="0" max="100" value="20"></label>
        <label>Minimum concrete temperature (°F) <input id="temp-limit" type="number" value="49"></label>
      </div>
    </details>
  </header>
  <main>
    <div class="map-wrap">
      <div id="map" aria-label="Jobsite map"></div>
      <span class="map-center-pin" aria-hidden="true">📍</span>
      <button class="map-select" id="select-location" type="button">Select location</button>
    </div>
    <p id="map-status" role="status">Loading map…</p>
    <h2>Hourly forecast</h2>
    <p id="forecast-info">Forecast from Open-Meteo</p>
    <div class="days" id="forecast-days" aria-label="Forecast day"></div>
    <p id="forecast-status" role="status">Loading forecast…</p>
    <div class="hours" id="hours" tabindex="0" role="region" aria-label="Hourly forecast; scroll horizontally"></div>
    <h2>Hazards</h2>
    <div class="hours" id="hazards" tabindex="0" role="region" aria-label="Hazards; scroll horizontally"></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function setupMap() {
      const status = document.getElementById('map-status');
      const location = document.getElementById('location');
      if (typeof L === 'undefined') { status.textContent = 'Map unavailable. Check your connection and reload.'; return; }
      const map = L.map('map').setView([40.230103, -111.65572], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
      let requestId = 0;
      let userSelected = false;
      async function select(lat, lon, message) {
        const id = ++requestId;
        map.setView([lat, lon], map.getZoom());
        const coordinates = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
        location.textContent = coordinates;
        status.textContent = message;
        showForecast(lat, lon);
        try {
          const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`);
          if (!response.ok) throw new Error('Location lookup failed');
          const result = await response.json();
          if (id !== requestId) return;
          const address = result.address || {};
          const city = address.city || address.town || address.village || address.municipality;
          location.textContent = [city, address.postcode].filter(Boolean).join(', ') || coordinates;
        } catch (_) { if (id === requestId) status.textContent = `${message} City and ZIP unavailable; showing coordinates.`; }
      }
      document.getElementById('select-location').addEventListener('click', () => {
        userSelected = true;
        const center = map.getCenter();
        select(center.lat, center.lng, 'Selected map location.');
      });
      select(40.230103, -111.65572, 'Default location: Provo. Move the map and select a location.');
      if (navigator.geolocation) navigator.geolocation.getCurrentPosition(position => {
        if (!userSelected) select(position.coords.latitude, position.coords.longitude, 'Using your current location.');
      }, () => { if (!userSelected) status.textContent = 'Location unavailable; using Provo. Move the map and select a location.'; });
    }
    let forecastRequest = 0;
    async function showForecast(lat, lon) {
      const request = ++forecastRequest;
      const status = document.getElementById('forecast-status');
      const info = document.getElementById('forecast-info');
      status.textContent = 'Loading forecast…';
      info.textContent = `Open-Meteo forecast for ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
      ['forecast-days', 'hours', 'hazards'].forEach(id => document.getElementById(id).replaceChildren());
      try {
        const params = new URLSearchParams({ latitude: lat, longitude: lon, hourly: 'temperature_2m,precipitation_probability,wind_speed_10m', timezone: 'auto', forecast_days: '7' });
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) throw new Error('Unable to load data');
        const data = await response.json();
        if (request !== forecastRequest) return;
        if (!data.hourly?.time?.length) throw new Error('Missing forecast hours');
        info.textContent = `Open-Meteo forecast for ${lat.toFixed(4)}, ${lon.toFixed(4)} · ${data.timezone} · fetched ${new Date().toLocaleString()}`;
        const hazards = document.getElementById('hazards');
        const limits = ['wind-limit', 'rain-limit', 'temp-limit'].map(id => document.getElementById(id));
        const row = document.getElementById('hours');
        const start = document.getElementById('work-start');
        const end = document.getElementById('work-end');
        const endError = document.getElementById('work-end-error');
        const dayTabs = document.getElementById('forecast-days');
        let selectedDay = data.hourly.time[0]?.slice(0, 10);
        [...new Set(data.hourly.time.map(time => time.slice(0, 10)))].forEach(date => {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.date = date;
          button.textContent = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }).format(new Date(date + 'T12:00:00Z'));
          button.addEventListener('click', () => { selectedDay = date; render(); });
          dayTabs.appendChild(button);
        });
        function render() {
        hazards.replaceChildren();
        const validWorkHours = Boolean(start.value && end.value && end.value >= start.value);
        const inWorkHours = time => {
          const hour = time.slice(11, 16);
          return start.value === end.value || (hour >= start.value && hour <= end.value);
        };
        const configured = limits.every(input => input.value !== '' && input.validity.valid);
        [...new Set(data.hourly.time.map(time => time.slice(0, 10)))].forEach(date => {
          const card = document.createElement('article');
          card.className = 'hour';
          const heading = document.createElement('h3');
          heading.textContent = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }).format(new Date(date + 'T12:00:00Z'));
          card.appendChild(heading);
          let found = false;
          data.hourly.time.forEach((time, i) => {
            if (time.slice(0, 10) !== date || !configured || !validWorkHours || !inWorkHours(time)) return;
            const wind = data.hourly.wind_speed_10m?.[i], rain = data.hourly.precipitation_probability?.[i], temp = data.hourly.temperature_2m?.[i];
            const issues = [];
            if (wind != null && Math.round(wind * 0.621371) >= Number(limits[0].value)) issues.push('🔴 Crane');
            if (rain != null && rain > Number(limits[1].value)) issues.push('🔴 Roofing');
            if (temp != null && temp * 9 / 5 + 32 < Number(limits[2].value)) issues.push('🔴 Concrete');
            if (!issues.length) return;
            found = true;
            const hour = Number(time.slice(11, 13));
            const line = document.createElement('p');
            line.textContent = `${hour % 12 || 12}:00 ${hour < 12 ? 'AM' : 'PM'} ${issues.join(' ')}`;
            card.appendChild(line);
          });
          if (!found) {
            const message = document.createElement('p');
            message.textContent = !validWorkHours ? 'Set valid work hours in Settings' : configured ? 'No hazards identified during work hours' : 'Set valid limits in Settings';
            card.appendChild(message);
          }
          hazards.appendChild(card);
        });
        dayTabs.querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.date === selectedDay)));
        row.replaceChildren();
        const invalidRange = Boolean(start.value && end.value && end.value < start.value);
        end.setAttribute('aria-invalid', String(invalidRange));
        endError.hidden = !invalidRange;
        if (!start.value || !end.value) {
          status.textContent = 'Choose both a start and an end time.';
          return;
        }
        if (invalidRange) {
          status.textContent = '';
          return;
        }
        let count = 0;
        data.hourly.time.forEach((time, i) => {
          if (time.slice(0, 10) !== selectedDay) return;
          const hour = time.slice(11, 16);
          const included = inWorkHours(time);
          if (!included) return;
          count++;
          const card = document.createElement('article');
          card.className = 'hour';
          const value = (key, unit) => data.hourly[key]?.[i] == null ? 'Unavailable' : `${data.hourly[key][i]} ${unit}`;
          const hourNumber = Number(hour.slice(0, 2));
          const displayTime = `${hourNumber % 12 || 12}:${hour.slice(3)} ${hourNumber < 12 ? 'AM' : 'PM'}`;
          const temperature = data.hourly.temperature_2m?.[i];
          const wind = data.hourly.wind_speed_10m?.[i];
          [ displayTime, `Temp: ${temperature == null ? 'Unavailable' : `${Math.round(temperature * 9 / 5 + 32)} °F`}`, `Rain chance: ${value('precipitation_probability', '%')}`, `Wind: ${wind == null ? 'Unavailable' : `${Math.round(wind * 0.621371)} mph`}` ].forEach(text => {
            const line = document.createElement('p');
            line.textContent = text;
            card.appendChild(line);
          });
          row.appendChild(card);
        });
        status.textContent = count ? '' : 'No hourly readings match the selected work hours.';
        }
        start.oninput = render;
        end.oninput = render;
        limits.forEach(input => { input.oninput = render; });
        render();
      } catch (error) {
        if (request === forecastRequest) status.textContent = 'Could not load the forecast. Check your connection and try selecting the location again.';
      }
    }
    setupMap();
  </script>
</body>
</html>
