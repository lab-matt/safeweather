<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safeweather</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; }
    header { position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; gap: 1rem; padding: 1rem; background: white; border-bottom: 1px solid #aaa; }
    header h1 { margin: 0; font-size: 1.25rem; }
    .location { text-align: center; }
    details { position: relative; justify-self: end; }
    summary { cursor: pointer; }
    .settings { position: absolute; right: 0; width: 18rem; max-width: 90vw; padding: 1rem; background: white; border: 1px solid #aaa; }
    .settings p { margin: 0 0 .75rem; }
    .settings label { display: block; margin-top: .75rem; }
    .settings input { display: block; width: 100%; margin-top: .25rem; }
    main { padding: 1rem; }
    .hours { display: flex; gap: .75rem; overflow-x: scroll; padding-bottom: 1rem; }
    .days { display: flex; gap: .5rem; overflow-x: auto; padding: .5rem 0; }
    .days button { white-space: nowrap; }
    .days button[aria-pressed="true"] { font-weight: bold; border-bottom: 3px solid currentColor; }
    .hour { flex: 0 0 10rem; border: 1px solid #aaa; border-radius: 1.5rem; padding: 1rem; }
    .hour p { margin: .75rem 0; }
    @media (max-width: 480px) { header { grid-template-columns: 1fr auto; } .location { grid-column: 1 / -1; grid-row: 2; } }
  </style>
</head>
<body>
  <header>
    <h1>Safeweather</h1>
    <div class="location" id="location">Location not selected</div>
    <details>
      <summary>Settings</summary>
      <div class="settings">
        <label>Work starts <input id="work-start" type="time" value="00:00"></label>
        <label>Work ends <input id="work-end" type="time" value="00:00"></label>
        <p>Safety limits will be defined later.</p>
        <label>Crane wind speed <input type="number" disabled></label>
        <label>Minimum chance of rain <input type="number" disabled></label>
        <label>Minimum temperature for concrete <input type="number" disabled></label>
      </div>
    </details>
  </header>
  <main>
    <h2>Hourly forecast</h2>
    <p>Saved test forecast for Provo, Utah · November 23–29, 2026 · America/Denver</p>
    <div class="days" id="forecast-days" aria-label="Forecast day"></div>
    <p id="forecast-status" role="status">Loading saved test data…</p>
    <div class="hours" id="hours" tabindex="0" role="region" aria-label="Hourly forecast; scroll horizontally"></div>
    <h2>Hazards</h2>
    <div class="hours" id="hazards" tabindex="0" role="region" aria-label="Hazards; scroll horizontally"></div>
  </main>
  <script>
    async function showForecast() {
      const status = document.getElementById('forecast-status');
      try {
        const response = await fetch('02_validation/open_meteo_provo_84606_2026-11-23.json');
        if (!response.ok) throw new Error('Unable to load data');
        const data = await response.json();
        const hazards = document.getElementById('hazards');
        [...new Set(data.hourly.time.map(time => time.slice(0, 10)))].forEach(date => {
          const card = document.createElement('article');
          card.className = 'hour';
          const heading = document.createElement('h3');
          heading.textContent = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }).format(new Date(date + 'T12:00:00Z'));
          const placeholder = document.createElement('p');
          placeholder.textContent = 'Hazard criteria not yet set';
          card.append(heading, placeholder);
          hazards.appendChild(card);
        });
        const row = document.getElementById('hours');
        const start = document.getElementById('work-start');
        const end = document.getElementById('work-end');
        const dayTabs = document.getElementById('forecast-days');
        let selectedDay = data.hourly.time[0]?.slice(0, 10);
        [...new Set(data.hourly.time.map(time => time.slice(0, 10)))].forEach(date => {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.date = date;
          button.textContent = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }).format(new Date(date + 'T12:00:00Z'));
          button.addEventListener('click', () => { selectedDay = date; render(); });
          dayTabs.appendChild(button);
        });
        function render() {
        dayTabs.querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.date === selectedDay)));
        row.replaceChildren();
        if (!start.value || !end.value) {
          status.textContent = 'Choose both a start and an end time.';
          return;
        }
        let count = 0;
        data.hourly.time.forEach((time, i) => {
          if (time.slice(0, 10) !== selectedDay) return;
          const hour = time.slice(11, 16);
          const included = start.value === end.value || (start.value < end.value ? hour >= start.value && hour <= end.value : hour >= start.value || hour <= end.value);
          if (!included) return;
          count++;
          const card = document.createElement('article');
          card.className = 'hour';
          const value = (key, unit) => data.hourly[key]?.[i] == null ? 'Unavailable' : `${data.hourly[key][i]} ${unit}`;
          const hourNumber = Number(hour.slice(0, 2));
          const displayTime = `${hourNumber % 12 || 12}:${hour.slice(3)} ${hourNumber < 12 ? 'AM' : 'PM'}`;
          const temperature = data.hourly.temperature_2m?.[i];
          const wind = data.hourly.wind_speed_10m?.[i];
          [ displayTime, `Temp: ${temperature == null ? 'Unavailable' : `${Math.round(temperature * 9 / 5 + 32)} °F`}`, `Rain chance: ${value('precipitation_probability', '%')}`, `Wind: ${wind == null ? 'Unavailable' : `${Math.round(wind * 0.621371)} mph`}` ].forEach(text => {
            const line = document.createElement('p');
            line.textContent = text;
            card.appendChild(line);
          });
          row.appendChild(card);
        });
        status.textContent = count ? '' : 'No hourly readings match the selected work hours.';
        }
        start.addEventListener('input', render);
        end.addEventListener('input', render);
        render();
      } catch (error) {
        status.textContent = 'Could not load the saved test data. Open the page through a local web server or GitHub Pages.';
      }
    }
    showForecast();
  </script>
</body>
</html>
